name: Build Shiva MatchTool Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor & Accept Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v
          echo "Installed NDKs:"
          ls -la "$ANDROID_HOME/ndk" || true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter clean
          flutter pub get
          mkdir -p android/gradle/wrapper
          if [ ! -f "android/gradlew" ]; then
            curl -sLo android/gradlew https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradlew || true
          fi
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ]; then
            curl -sLo android/gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.7.0/gradle/wrapper/gradle-wrapper.jar || true
          fi
          chmod +x android/gradlew || true
          touch android/local.properties
          if [ -n "$FLUTTER_ROOT" ] && ! grep -q "flutter.sdk" android/local.properties; then
            echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties
          fi
          if [ -n "$ANDROID_HOME" ] && ! grep -q "sdk.dir" android/local.properties; then
            echo "sdk.dir=$ANDROID_HOME" >> android/local.properties
          fi
          cat android/local.properties

      - name: Build Android APK (Release)
        run: |
          cd mobile
          chmod +x android/gradlew || true
          flutter build apk --release --no-tree-shake-icons -v

      - name: Locate Built APK
        run: |
          find mobile/ -name "*.apk" -type f || ls -la mobile/build/app/outputs/flutter-apk/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiva-matchtool-apk
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/**/*.apk
            mobile/**/*.apk
          if-no-files-found: error

