name: Build Shiva MatchTool Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Flutter Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Check Flutter Doctor & Accept Licenses
        run: |
          yes | flutter doctor --android-licenses || true
          flutter doctor -v

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter clean
          flutter pub get

      - name: Build Android APK (Release)
        run: |
          cd mobile
          chmod +x android/gradlew || true
          flutter build apk --release --no-tree-shake-icons --android-skip-build-dependency-validation -v

      - name: Locate Built APK
        run: |
          ls -la mobile/build/app/outputs/flutter-apk/ || ls -la mobile/build/app/outputs/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shiva-matchtool-apk
          path: |
            mobile/build/app/outputs/flutter-apk/*.apk
            mobile/build/app/outputs/**/*.apk
          if-no-files-found: error

