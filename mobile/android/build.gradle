allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// AGP 8.0+ fallback namespace for any older plugins lacking a namespace
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            def androidExtension = project.extensions.findByName('android')
            if (androidExtension != null) {
                def hasNamespace = false
                try {
                    def ns = androidExtension.namespace
                    if (ns != null && !ns.toString().trim().isEmpty()) {
                        hasNamespace = true
                    }
                } catch (Throwable ignored) {
                    hasNamespace = false
                }
                if (!hasNamespace) {
                    try {
                        def fallbackNamespace = project.group?.toString()?.trim()
                        if (!fallbackNamespace || fallbackNamespace == 'unspecified') {
                            fallbackNamespace = "com.shiva.matchtool.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
                        }
                        androidExtension.namespace = fallbackNamespace
                    } catch (Throwable ignored) {
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


