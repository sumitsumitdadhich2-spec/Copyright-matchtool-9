allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

subprojects {
    project.evaluationDependsOn(":app")
}

// AGP 8.0+ requires a namespace for each library/plugin module
subprojects {
    project.plugins.withId("com.android.library") {
        if (project.android.namespace == null) {
            project.android.namespace = project.group ?: "com.shiva.matchtool.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
        }
    }
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group ?: "com.shiva.matchtool.${project.name.replaceAll('[^a-zA-Z0-9_]', '_')}"
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


