name: shiva_matchtool
description: AI-powered video copyright matching tool
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_generative_ai: ^0.4.0
  ffmpeg_kit_flutter_full: ^6.0.3
  video_player: ^2.8.0
  chewie: ^1.7.0
  file_picker: ^6.1.1
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  uuid: ^4.2.0
  intl: ^0.18.0
  permission_handler: ^11.0.0
  device_info_plus: ^9.1.0
  flutter_isolate: ^2.0.4
  sqflite: ^2.3.0
  path: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
